<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مثال HTML</title>
</head>
<body>

    <h2>الروابط (Links)</h2>
    <a href="https://www.google.com" target="_blank">اذهب إلى جوجل</a>

    <hr>

    <h2>الصور (Images)</h2>
    <img src="image.jpg" alt="صورة جميلة" width="200">

    <hr>

    <h2>الجداول (Tables)</h2>
    <table border="1">
        <tr>
            <th>الاسم</th>
            <th>العمر</th>
        </tr>
        <tr>
            <td>أحمد</td>
            <td>20</td>
        </tr>
    </table>

    <hr>

    <h2>الصوت (Audio)</h2>
    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        متصفحك لا يدعم تشغيل الملف الصوتي.
    </audio>

    <hr>

    <h2>النصوص المتحركة</h2>
    <marquee behavior="scroll" direction="right">مرحباً بك في موقعي</marquee>

</body>
</html>
